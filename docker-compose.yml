version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: passport_photo_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_KEY_ENABLED=false
      - APP_API_KEY=
      - MAX_UPLOAD_MB=50
      - DEFAULT_DPI=300
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      - ./backend/temp:/app/temp

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: passport_photo_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
